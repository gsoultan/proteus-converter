<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Grid layout</title>
<style>
  @page { size: A4; margin: 1cm; }
  body { font-family: sans-serif; font-size: 13px; color: #111827; }
  .page { display: grid; grid-template-columns: 170px 1fr; grid-template-areas: "top top" "side main" "foot foot"; gap: 10px; }
  .top { grid-area: top; background: #0f766e; color: #fff; padding: 10px; font-size: 18px; }
  .side { grid-area: side; background: #f0fdfa; padding: 10px; }
  .main { grid-area: main; }
  .foot { grid-area: foot; border-top: 1px solid #99f6e4; padding-top: 6px; color: #475569; }
  .products { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .product { border: 1px solid #d1d5db; padding: 8px; }
  .product .img { height: 50px; background: #e5e7eb; margin-bottom: 6px; }
  .wide { grid-column: span 2; background: #fef9c3; }
  .auto { display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 6px; margin-top: 12px; }
  .auto div { background: #e0f2fe; padding: 6px; text-align: center; }
  .form { display: grid; grid-template-columns: max-content 1fr; gap: 6px 12px; margin-top: 12px; align-items: center; }
  .form .field { border: 1px solid #9ca3af; height: 20px; }
  .placed { display: grid; grid-template-columns: repeat(4, 1fr); grid-auto-rows: 36px; gap: 4px; margin-top: 12px; }
  .placed div { background: #ede9fe; }
  .placed .x { grid-column: 2 / 4; grid-row: 1 / 3; background: #8b5cf6; }
</style>
</head>
<body>
<div class="page">
  <div class="top">Catalogue</div>
  <div class="side">Categories<br>Tools<br>Garden<br>Kitchen</div>
  <div class="main">
    <div class="products">
      <div class="product"><div class="img"></div>Hammer<br>$12</div>
      <div class="product"><div class="img"></div>Trowel<br>$8</div>
      <div class="product"><div class="img"></div>Kettle<br>$24</div>
      <div class="product wide">Bundle offer: any two garden tools with a ten percent discount until the end of the month.</div>
      <div class="product"><div class="img"></div>Shears<br>$15</div>
    </div>
    <div class="auto"><div>A</div><div>B</div><div>C</div><div>D</div><div>E</div><div>F</div><div>G</div></div>
    <div class="form"><span>Name</span><div class="field"></div><span>Delivery address</span><div class="field"></div></div>
    <div class="placed"><div></div><div class="x"></div><div></div><div></div><div></div><div></div><div></div></div>
  </div>
  <div class="foot">Prices include tax.</div>
</div>
</body>
</html>
