name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install fonts and poppler
        run: sudo apt-get update && sudo apt-get install -y fonts-liberation fonts-dejavu-core poppler-utils
      - name: Vet
        run: go vet ./...
      - name: Format
        run: test -z "$(gofmt -l .)"
      - name: Test
        run: go test -race ./...

  # Short fuzz runs on every change; run longer locally with -fuzztime.
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-liberation fonts-dejavu-core
      - name: Fuzz
        run: |
          go test -run XXX -fuzz '^FuzzParse$' -fuzztime 30s ./css
          for f in FuzzConvertHTML FuzzConvertMarkdown FuzzConvertCSS; do
            go test -run XXX -fuzz "^$f\$" -fuzztime 30s .
          done

  # Pixel diff against headless Chromium. Chromium is only a reference here;
  # proteus itself never needs a browser at runtime.
  accuracy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install fonts, poppler and Chromium
        run: |
          sudo apt-get update && sudo apt-get install -y fonts-liberation fonts-dejavu-core poppler-utils
          npm install --no-save playwright@1.48.2
          npx playwright install --with-deps chromium
      - name: Compare with Chromium
        run: ./accuracy/run.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accuracy
          path: accuracy/out/*.png
